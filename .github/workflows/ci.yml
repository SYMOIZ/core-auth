name: Core-Auth CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  core-auth-pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: sqlite+aiosqlite:///./coreauth.db
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci-access-secret-do-not-use-in-prod
      REFRESH_TOKEN_SECRET: ci-refresh-secret-do-not-use-in-prod
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Wait for Redis health check
        run: |
          echo "Waiting for Redis..."
          for i in {1..10}; do
            if uv run python -c "
import asyncio, redis.asyncio as r
async def p():
    c = r.from_url('redis://localhost:6379')
    res = await c.ping()
    await c.aclose()
    print('Redis ready:', res)
asyncio.run(p())
            "; then
              break
            fi
            echo "Retry $i..."
            sleep 2
          done

      - name: Stage 2 - Linter Engine (flake8)
        run: |
          uv run flake8 app/ tests/ \
            --max-line-length=88 \
            --extend-ignore=E501 \
            --statistics \
            --count

      - name: Stage 3 - Static Security Audit (bandit)
        run: |
          uv run bandit -r app/ -ll --format txt

      - name: Stage 4 - Async Test Suites (pytest)
        run: |
          uv run pytest tests/ -v \
            --asyncio-mode=auto \
            --tb=short
